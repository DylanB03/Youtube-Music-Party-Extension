name = "youtube-music-party-backend-e2e"
main = "src/index.ts"
compatibility_date = "2026-06-02"

[vars]
HOST_RECONNECT_GRACE_MS = "250"
MAX_PARTICIPANTS = "2"
MAX_QUEUE_ITEMS = "3"
ROOM_MAX_AGE_MS = "10000"
ROOM_IDLE_TTL_MS = "2000"
INVITE_TTL_SECONDS = "60"

[[durable_objects.bindings]]
name = "PARTY_ROOMS"
class_name = "PartyRoom"

[[kv_namespaces]]
binding = "INVITES"
id = "e2e-kv"
preview_id = "e2e-kv"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PartyRoom"]
