name: Publish Chrome extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: chrome-web-store-production
  cancel-in-progress: false

jobs:
  publish:
    name: Verify, package, and submit
    runs-on: ubuntu-latest
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Verify release tag
        run: npm run verify:release-version -- "${GITHUB_REF_NAME}"

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run audit:production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      - name: Preserve browser failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.ref_name }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Build release archive
        run: npm run release:extension

      - name: Verify release archive
        run: npm run verify:extension

      - name: Preserve release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: togethertune-${{ github.ref_name }}-chrome
          path: apps/extension/.output/*-chrome.zip
          if-no-files-found: error
          retention-days: 30

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload and submit to Chrome Web Store
        run: npm run publish:chrome-web-store
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
